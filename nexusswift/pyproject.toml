[project]
name = "nexusswift"
version = "1.0.0"
description = "Zero-trust ISO 20022 pacs.008 cross-border financial messaging and clearing hub"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=42.0.0,<47", "aiosqlite>=0.20.0,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
