name: Security Audit

# Hard gate: high-severity advisories in PRODUCTION dependencies fail the build.
#
# This was report-only, wrapped in `if ! npm audit`, because both packages
# carried a known advisory baseline. That wrapper made the job incapable of
# failing — and its green check was then read as evidence the baseline was
# clean, which it was not: the app carried 7 high-severity advisories at the
# time. A check that cannot fail does not just miss problems, it actively
# misreports them.
#
# The baseline was cleared (2026-08-08, `npm audit fix`, lockfile-only, no
# direct dependency versions changed), so the wrapper is now gone as its
# original author intended. Remediation still arrives via Dependabot PRs
# (see .github/dependabot.yml); this gate keeps the baseline at zero.
#
# If this job goes red: fix or explicitly accept the advisory. Do not
# reinstate the wrapper.
#
# 2026-09-03: the step no longer calls `npm audit` directly. The advisory
# endpoint returned 503 for several minutes and this job went red on three
# unrelated branches — including the commit merged to main — with no way for a
# reader to tell a REGISTRY OUTAGE from a REAL VULNERABILITY, because
# `npm audit` exits 1 for both. `scripts/npm-audit-gate.mjs` reads the JSON
# report instead of interpreting the exit code, retries a transport failure
# (a 503 clears in seconds), and still FAILS when the state cannot be
# determined — unknown is not clean — but says which of the two it is in the
# first line. The gate is not weakened: it cannot pass without a report
# showing zero advisories at the level.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [compliance-firewall-agent, proxy]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Audit production dependencies (high+)
        # Runs from ${{ matrix.package }} via defaults.run.working-directory;
        # the script lives at the repo root, hence the relative path.
        run: node ../scripts/npm-audit-gate.mjs --level=high
