services:
  houndshield-proxy:
    # Must match what .github/workflows/docker-publish.yml actually pushes.
    # This previously pointed at ghcr.io/thecelestialmismatch/houndshield-proxy,
    # an image that is never built or published anywhere — so the documented
    # Mode B install failed on the pull for every customer who tried it.
    image: houndshield/proxy:latest
    # Uncomment to build locally instead:
    # build: .
    container_name: houndshield-proxy
    restart: unless-stopped
    ports:
      # LOOPBACK ONLY, deliberately.
      #
      # This was "8080:8080", which binds 0.0.0.0 on the host and publishes the
      # proxy to every machine that can route to it. The listener is plain HTTP
      # (server.ts is an Express app, not an HTTPS intercept proxy — there is no
      # CONNECT handler and no TLS listener), so that mapping put unencrypted
      # CUI-bearing prompts on the customer's LAN. On a product whose entire
      # claim is DFARS 252.204-7012 boundary control, that is the failure the
      # product exists to prevent.
      #
      # Serving other hosts is a supported deployment — put a TLS-terminating
      # reverse proxy (nginx, Caddy, the customer's existing ingress) in front
      # and point it at 127.0.0.1:8080. Do not widen this line to do it.
      - "127.0.0.1:8080:8080"
    environment:
      # Required: your Hound Shield license key from https://houndshield.com/dashboard
      HOUNDSHIELD_LICENSE_KEY: ${HOUNDSHIELD_LICENSE_KEY}
      # Required: your AI provider API key (the one your team normally uses)
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY}
      # Optional: openai | anthropic | google | openrouter  (default: openai)
      UPSTREAM_PROVIDER: ${UPSTREAM_PROVIDER:-openai}
      #
      # Administers quarantine release, policy changes and the audit endpoints.
      #
      # Leave it unset and it falls back to HOUNDSHIELD_LICENSE_KEY — which
      # means ONE secret both licenses and administers the proxy, so a licence
      # key shared with a contractor, pasted into a ticket, or read out of
      # `docker inspect` also releases quarantined CUI and rewrites your
      # detection policy. Set it. `openssl rand -hex 32`.
      HOUNDSHIELD_ADMIN_TOKEN: ${HOUNDSHIELD_ADMIN_TOKEN:-}
      #
      # Air-gapped (Mode C) only. Entitlement for a deployment that cannot reach
      # houndshield.com, as an Ed25519-signed token verified locally against the
      # public key below. Issued with scripts/issue-offline-license.mjs.
      #
      # The proxy no longer treats "houndshield.com is unreachable" as proof of
      # entitlement, so this is how a genuinely disconnected install stays
      # licensed. Both variables are needed; neither is secret to the customer.
      HOUNDSHIELD_OFFLINE_LICENSE: ${HOUNDSHIELD_OFFLINE_LICENSE:-}
      HOUNDSHIELD_LICENSE_PUBLIC_KEY: ${HOUNDSHIELD_LICENSE_PUBLIC_KEY:-}
      NODE_ENV: production
    volumes:
      # Persistent local event log — never leaves your machine.
      #
      # The log is SHA-256 hash-chained: every row carries the digest of the one
      # before it, so an edit, a deletion or a forged insert is detectable.
      # Verify it any time with:
      #   curl -H "x-admin-token: $HOUNDSHIELD_ADMIN_TOKEN" \
      #        http://127.0.0.1:8080/v1/audit/verify
      - houndshield-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  houndshield-data:
    driver: local
